
services:
  # 1. PostgreSQL Baza
  postgres:
    image: postgres:16-alpine
    container_name: perisafe_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-perisafe_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-perisafe_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-perisafe_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Kesh va Celery Broker
  redis:
    image: redis:7-alpine
    container_name: perisafe_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: perisafe_api
    restart: always
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Celery Worker (Telegram ogohlantirishlar va asinxron vazifalar)
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: perisafe_celery_worker
    restart: always
    command: celery -A app.worker.celery_app.celery worker --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 5. Celery Beat (Har daqiqalik 60-daqiqalik SLA tekshiruvchi scheduler)
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: perisafe_celery_beat
    restart: always
    command: celery -A app.worker.celery_app.celery beat --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
