version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: perisafe-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: perisafe_user
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: perisafe_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: perisafe-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: perisafe-api
    # Live-reload komandasi (xakatonda tez ishlash uchun)
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://perisafe_user:devpassword@db:5432/perisafe_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: perisafe-worker
    command: celery -A app.worker.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://perisafe_user:devpassword@db:5432/perisafe_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - api

volumes:
  postgres_data:
  redis_data:
