[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "__pycache__", "tests"]

[tool.ruff.lint]
# E: pycodestyle, F: pyflakes, I: isort (importlarni to'g'rilash)
select = ["E", "F", "I"]
ignore = []

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# Xakatonda tezlik uchun strict mode o'chirilgan, faqat asosiy tiplarni tekshiradi
strict = false
warn_return_any = true
warn_unused_configs = true
